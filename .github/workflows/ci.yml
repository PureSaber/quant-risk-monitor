name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    # Keep the existing Linux check names required by the repository ruleset.
    name: ${{ matrix.os == 'ubuntu-24.04' && format('test ({0})', matrix.python-version) || format('test ({0}, {1})', matrix.os, matrix.python-version) }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install locked dependencies
        run: |
          python -m pip install --no-deps --requirement requirements.lock
          python -m pip check
          python -m pip install --no-deps --no-build-isolation --editable .
          python -m pip check

      - name: Ruff check
        run: python -m ruff check src tests

      - name: Ruff format
        run: python -m ruff format --check src tests

      - name: Pytest
        run: python -m pytest -q --cov=quant_risk_monitor --cov-branch --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=80

      - name: Core policy branch coverage
        run: >-
          python -c "import json; data=json.load(open('coverage.json', encoding='utf-8'));
          summary=next(value['summary'] for key,value in data['files'].items()
          if key.replace(chr(92),'/').endswith('src/quant_risk_monitor/cross_asset.py'));
          covered=summary['covered_branches']; total=summary['num_branches'];
          percent=100*covered/total; print(f'cross_asset branch coverage: {percent:.2f}%');
          assert percent >= 90, f'core branch coverage {percent:.2f}% is below 90%'"

      - name: Chronological diagnostic CLI controls
        run: |
          python examples/model_diagnostics_demo.py state/diagnostic-inputs
          quant-risk diagnose-model --input state/diagnostic-inputs/change.json --out state/diagnostic-change
          quant-risk diagnose-model --input state/diagnostic-inputs/null.json --out state/diagnostic-null

      - name: Advanced factor-risk research and independent recomputation
        run: |
          python examples/advanced_barra_research.py state/advanced-inputs
          quant-risk build-exposures --input state/advanced-inputs/exposures.json --out state/exposure-build
          quant-risk verify-research --run state/exposure-build
          quant-risk calibrate-risk --input state/advanced-inputs/calibration.json --out state/risk-calibration
          quant-risk verify-research --run state/risk-calibration
