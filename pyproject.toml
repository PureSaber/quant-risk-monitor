[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-risk-monitor"
version = "0.4.0"
description = "PIT cross-asset risk policy and portfolio analytics for PureSaber research"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "quant-data-kit @ git+https://github.com/PureSaber/quant-data-kit.git@a84c7306a2f3ad6d2f2c90901d6525d091ab49d6",
    "quant-execution @ git+https://github.com/PureSaber/quant-execution.git@f31022edf5272b4cda6e7c0ff4d0eefa671a68fa",
]

[project.optional-dependencies]
dev = [
    "exceptiongroup>=1",
    "pytest>=7.4",
    "pytest-cov>=5.0",
    "ruff==0.17.1",
    "tomli>=2.0; python_version < '3.11'",
]

[tool.quant-workspace]
layer = "portfolio-risk"
schemas = [
    { id = "puresaber.instrument-spec", version = "2.0.0" },
    { id = "puresaber.execution.account-snapshot", version = "1.1.0" },
    { id = "puresaber.execution.order-intent", version = "1.1.0" },
]
lock-files = ["requirements.lock"]

[project.scripts]
quant-risk = "quant_risk_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.coverage.run]
branch = true
source = ["quant_risk_monitor"]

[tool.coverage.report]
fail_under = 80
show_missing = true
